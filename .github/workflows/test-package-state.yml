name: Package state regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned static checker
        run: |
          python3 -m pip install --only-binary=:all: 'ruff==0.16.5'
      - name: Reject undefined first-party names
        run: python3 -m ruff check --select F821,F822,F823 PackageManager.py tests
      - run: python3 -m compileall -q PackageManager.py tests
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
